<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phrasal Verbs Mastery | English Grammar B1–B2 | Units 137–144</title>
<meta name="description" content="Interactive English phrasal verbs learning app for Vietnamese B1-B2 learners. Units 137-144.">
<style>
/* ============ RESET & TOKENS ============ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#1e2433;
  --muted:#68718a;
  --primary:#4b62e0;
  --primary-d:#3a4fc4;
  --primary-soft:#eceffd;
  --green:#1f9d6b;
  --green-soft:#e6f7f0;
  --red:#d94b45;
  --red-soft:#fdeceb;
  --amber:#b97d12;
  --amber-soft:#fdf3e2;
  --border:#e3e7f0;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.06);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.25;font-weight:700}
h1{font-size:1.6rem}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0 0 .7em}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;font-size:inherit}
:focus-visible{outline:3px solid #93a4f5;outline-offset:2px;border-radius:8px}

/* ============ TOP BAR ============ */
.topbar{
  position:sticky;top:0;z-index:60;background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:10px 16px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
.brand .logo{
  width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#4b62e0,#7b8ef7);
  display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;flex:0 0 auto;
}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
.topbar .spacer{flex:1}
.searchbox{
  display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);
  border-radius:10px;padding:7px 12px;max-width:340px;flex:1;
}
.searchbox input{border:0;background:transparent;outline:none;width:100%;font-size:14px;color:var(--text)}
.iconbtn{
  border:1px solid var(--border);background:#fff;border-radius:10px;padding:7px 11px;cursor:pointer;
  transition:.15s;color:var(--text);line-height:1;
}
.iconbtn:hover{background:var(--primary-soft);border-color:#c9d2fb}

/* ============ LAYOUT ============ */
.layout{
  display:grid;grid-template-columns:236px minmax(0,1fr);gap:22px;
  max-width:1300px;margin:0 auto;padding:20px 16px 40px;align-items:start;
}
.sidebar{position:sticky;top:74px}
.navcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:8px;box-shadow:var(--shadow-sm)}
.navitem{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;cursor:pointer;
  color:var(--text);font-size:14px;font-weight:500;border:0;background:transparent;width:100%;text-align:left;
  transition:.14s;
}
.navitem:hover{background:var(--bg)}
.navitem.active{background:var(--primary-soft);color:var(--primary-d);font-weight:700}
.navitem .ic{font-size:16px;width:20px;text-align:center}
.navsec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 12px 4px;font-weight:700}

main{min-width:0}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ============ CARDS ============ */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow-sm);margin-bottom:16px;
}
.card.pad-lg{padding:22px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ============ BUTTONS ============ */
.btn{
  border:1px solid var(--border);background:#fff;color:var(--text);border-radius:10px;
  padding:9px 16px;cursor:pointer;font-weight:600;font-size:14px;transition:.15s;
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
}
.btn:hover{background:var(--bg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover{background:#c33f39}
.btn.small{padding:6px 12px;font-size:13px}
.btn.block{width:100%}

/* ============ STATS ============ */
.stat{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;
  box-shadow:var(--shadow-sm);
}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.stat .v{font-size:1.7rem;font-weight:800;line-height:1.2;margin-top:4px;letter-spacing:-.5px}
.stat .sub{font-size:12px;color:var(--muted)}

/* ============ PROGRESS BAR ============ */
.bar{height:8px;background:#eef1f7;border-radius:99px;overflow:hidden;margin:8px 0}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,#4b62e0,#7b8ef7);border-radius:99px;transition:width .3s}
.bar.green>span{background:linear-gradient(90deg,#1f9d6b,#4ec79a)}
.bar.amber>span{background:linear-gradient(90deg,#d99a2b,#eec06a)}

/* ============ PILLS ============ */
.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
  padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--border);
}
.pill.green{background:var(--green-soft);color:#12724b;border-color:#c4ecdc}
.pill.red{background:var(--red-soft);color:#a8342f;border-color:#f6cfcd}
.pill.amber{background:var(--amber-soft);color:#8a5a05;border-color:#f2ddb4}
.pill.blue{background:var(--primary-soft);color:var(--primary-d);border-color:#cdd6fb}

/* ============ UNIT CARD ============ */
.unitcard{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:8px;transition:.15s;
}
.unitcard:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.unitcard .uhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.unitcard .unum{font-size:12px;font-weight:800;color:var(--primary-d);letter-spacing:.04em}
.unitcard .utitle{font-weight:700;font-size:15px;margin-top:2px}
.unitcard .udesc{font-size:13px;color:var(--muted);min-height:38px}

/* ============ STUDY ============ */
.phrase{
  font-size:1.9rem;font-weight:800;letter-spacing:-.6px;color:var(--primary-d);margin:0;line-height:1.2;
}
.vi-meaning{font-size:1.05rem;font-weight:600;color:#12724b;margin-top:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 14px}
.tab{
  border:1px solid var(--border);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--muted);transition:.14s;
}
.tab:hover{background:var(--bg)}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.panel{display:none}
.panel.active{display:block}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px}
.kv .k{color:var(--muted);font-weight:600}
.note{
  background:var(--primary-soft);border-left:3px solid var(--primary);border-radius:8px;
  padding:9px 12px;font-size:13.5px;margin-top:8px;
}
.note.bad{background:var(--red-soft);border-left-color:var(--red)}
.note.good{background:var(--green-soft);border-left-color:var(--green)}
.exbox{
  background:var(--bg);border-radius:10px;padding:12px 14px;font-size:14.5px;margin-top:10px;
  border:1px dashed var(--border);
}
.exbox .en{font-weight:600}
.exbox .vi{color:var(--muted);font-size:13.5px;margin-top:4px}

/* ============ QUIZ ============ */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.qtext{font-size:1.08rem;font-weight:600;line-height:1.55;margin:6px 0 14px}
.opt{
  display:flex;align-items:flex-start;gap:11px;border:1.5px solid var(--border);background:#fff;
  border-radius:11px;padding:12px 14px;cursor:pointer;margin-bottom:9px;transition:.13s;width:100%;
  text-align:left;font-size:14.5px;line-height:1.5;
}
.opt:hover{border-color:#b9c4f2;background:#fbfcff}
.opt .letter{
  flex:0 0 24px;height:24px;border-radius:7px;background:var(--bg);display:grid;place-items:center;
  font-weight:800;font-size:12px;color:var(--muted);
}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.sel .letter{background:var(--primary);color:#fff}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .letter{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .letter{background:var(--red);color:#fff}
.opt[disabled]{cursor:default}
.opt .mark{margin-left:auto;font-weight:800;font-size:15px}

.feedback{border-radius:12px;padding:14px 16px;margin-top:14px;font-size:14px;border:1px solid}
.feedback.ok{background:var(--green-soft);border-color:#c4ecdc}
.feedback.no{background:var(--red-soft);border-color:#f6cfcd}
.feedback h4{margin-bottom:6px;font-size:14.5px}

.inputline{
  width:100%;border:1.5px solid var(--border);border-radius:11px;padding:12px 14px;font-size:15px;
  font-family:inherit;outline:none;transition:.14s;background:#fff;
}
.inputline:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(75,98,224,.12)}
textarea.inputline{min-height:78px;resize:vertical;line-height:1.5}

/* matching */
.matchwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.matchcol{display:flex;flex-direction:column;gap:8px}
.mitem{
  border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;
  font-size:14px;transition:.13s;text-align:left;width:100%;
}
.mitem:hover{border-color:#b9c4f2;background:#fbfcff}
.mitem.sel{border-color:var(--primary);background:var(--primary-soft)}
.mitem.matched{border-color:#9bc7b3;background:#f2fbf7}
.mitem.done{border-color:var(--green);background:var(--green-soft);cursor:default}
.mitem.bad{border-color:var(--red);background:var(--red-soft)}
.mitem .tagline{font-size:12px;color:var(--muted);display:block;margin-top:2px}

/* ============ TABLE ============ */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;background:#fafbfe}

/* ============ MISC ============ */
.empty{text-align:center;padding:38px 16px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:8px;opacity:.6}
.list-item{
  border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;background:#fff;
}
.list-item .q{font-weight:600;font-size:14.5px}
.ansline{font-size:13.5px;margin-top:6px}
.ansline .lbl{color:var(--muted);font-weight:600}
.wrongtxt{color:var(--red);font-weight:700}
.righttxt{color:var(--green);font-weight:700}
hr{border:0;border-top:1px solid var(--border);margin:16px 0}
.banner{
  background:linear-gradient(135deg,#4b62e0,#7b8ef7);color:#fff;border-radius:var(--radius);
  padding:24px;box-shadow:var(--shadow);margin-bottom:18px;
}
.banner h1{color:#fff;font-size:1.75rem}
.banner p{color:rgba(255,255,255,.9);margin-bottom:14px;max-width:620px}
.banner .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}
.banner .btn:hover{background:rgba(255,255,255,.28)}
.banner .btn.solid{background:#fff;color:var(--primary-d);border-color:#fff}
.banner .btn.solid:hover{background:#eef1ff}

.timerbox{
  font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;padding:6px 12px;border-radius:10px;
  background:var(--bg);border:1px solid var(--border);
}
.timerbox.warn{background:var(--amber-soft);border-color:#f2ddb4;color:#8a5a05}
.timerbox.danger{background:var(--red-soft);border-color:#f6cfcd;color:#a8342f}

.toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:86px;z-index:200;
  background:#1e2433;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.22s;box-shadow:var(--shadow);max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ MOBILE NAV ============ */
.mobilenav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:70;background:rgba(255,255,255,.97);
  backdrop-filter:blur(10px);border-top:1px solid var(--border);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.mobilenav .inner{display:flex;justify-content:space-around;align-items:stretch}
.mnav{
  flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;cursor:pointer;color:var(--muted);font-size:10.5px;font-weight:600;border-radius:10px;
}
.mnav .ic{font-size:18px;line-height:1}
.mnav.active{color:var(--primary-d);background:var(--primary-soft)}

/* ============ RESPONSIVE ============ */
@media (max-width:980px){
  .layout{grid-template-columns:1fr;padding-bottom:96px}
  .sidebar{display:none}
  .mobilenav{display:block}
  .searchbox{max-width:none}
}
@media (max-width:640px){
  body{font-size:14.5px}
  .topbar{padding:9px 12px;gap:8px}
  .brand small{display:none}
  .brand span.name{display:none}
  .layout{padding:14px 12px 96px}
  .card{padding:15px}
  .banner{padding:18px}
  .banner h1{font-size:1.4rem}
  .phrase{font-size:1.55rem}
  .kv{grid-template-columns:1fr}
  .kv .k{margin-top:6px}
  .matchwrap{grid-template-columns:1fr;gap:14px}
  .stat .v{font-size:1.4rem}
}
</style>
</head>

<header class="topbar">
  <div class="brand">
    <div class="logo">PV</div>
    <div>
      <span class="name">Phrasal Verbs Mastery</span>
      <small>English Grammar B1–B2 · Units 137–144</small>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="searchbox" role="search">
    <span aria-hidden="true">🔍</span>
    <input id="globalSearch" type="search" placeholder="Tìm phrasal verb, nghĩa tiếng Việt, Unit…" aria-label="Search phrasal verbs">
  </div>
  <button class="iconbtn" id="btnSettingsTop" title="Settings" aria-label="Settings">⚙️</button>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav class="navcard" id="sidebarNav" aria-label="Main navigation"></nav>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>

<nav class="mobilenav" aria-label="Mobile navigation">
  <div class="inner" id="mobileNav"></div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* =========================================================================
   PHRASAL VERBS MASTERY — Units 137–144
   Single-file interactive learning app (HTML + CSS + JS, no backend)
   ========================================================================= */

const APP_VERSION = "1.0.0";
const STORAGE_KEY = "pv_mastery_v1";

/* =========================================================================
   1. CONTENT — UNITS 137–144
   ========================================================================= */

const UNITS = [
{
  id:137, title:"Phrasal Verbs 1", subtitle:"Giới thiệu chung",
  desc:"Cấu trúc verb + particle, cách tiểu từ làm thay đổi nghĩa, và vị trí của tân ngữ (danh từ vs đại từ).",
  items:[
    {id:"u137-01",phrase:"break down",meaningVi:"bị hỏng (máy móc, xe cộ); suy sụp tinh thần",
     explanation:"to stop working (of a machine or a vehicle); to lose control of your feelings",
     pattern:"break down",objectType:"nội động từ (intransitive) — không có tân ngữ",
     example:"My car broke down on the way to work.",
     translation:"Xe của tôi bị hỏng trên đường đi làm.",
     notes:["Không có tân ngữ: ✅ My car broke down. ❌ My car broke down it."],
     category:"Nghĩa"},
    {id:"u137-02",phrase:"take off",meaningVi:"cởi ra (quần áo); cất cánh (máy bay)",
     explanation:"to remove clothes; (of a plane) to leave the ground and start flying",
     pattern:"take off + noun  /  take + noun + off",objectType:"tách được (separable)",
     example:"Take off your coat. / Take your coat off. / Take it off.",
     translation:"Cởi áo khoác ra. / Cởi nó ra.",
     notes:["Với đại từ (it/them) BẮT BUỘC đặt giữa: ✅ Take it off. ❌ Take off it."],
     category:"Tách được"},
    {id:"u137-03",phrase:"turn on",meaningVi:"bật (thiết bị, đèn, TV)",
     explanation:"to start a machine, light or device working",
     pattern:"turn on + noun  /  turn + noun + on",objectType:"tách được (separable)",
     example:"Turn on the light, please. / Turn the light on. / Turn it on.",
     translation:"Bật đèn lên. / Bật nó lên.",
     notes:["✅ Turn it on.  ❌ Turn on it."],
     category:"Tách được"},
    {id:"u137-04",phrase:"turn off",meaningVi:"tắt (thiết bị, đèn, TV)",
     explanation:"to stop a machine, light or device working",
     pattern:"turn off + noun  /  turn + noun + off",objectType:"tách được (separable)",
     example:"Don't forget to turn off the lights before you leave.",
     translation:"Đừng quên tắt đèn trước khi rời đi.",
     notes:["✅ Turn them off.  ❌ Turn off them."],
     category:"Tách được"},
    {id:"u137-05",phrase:"put on",meaningVi:"mặc vào, đội vào; bật (đèn, nhạc)",
     explanation:"to dress yourself in something; to make a device start working",
     pattern:"put on + noun  /  put + noun + on",objectType:"tách được (separable)",
     example:"Put on your shoes. / Put your shoes on. / Put them on.",
     translation:"Đi giày vào. / Đi chúng vào.",
     notes:["✅ Put it on.  ❌ Put on it."],
     category:"Tách được"},
    {id:"u137-06",phrase:"wake up",meaningVi:"thức dậy; đánh thức ai",
     explanation:"to stop sleeping; to make somebody stop sleeping",
     pattern:"wake up  /  wake + somebody + up",objectType:"tách được (separable)",
     example:"I woke up at seven. / Wake me up at seven, please.",
     translation:"Tôi thức dậy lúc bảy giờ. / Đánh thức tôi lúc bảy giờ nhé.",
     notes:["✅ Wake me up.  ❌ Wake up me."],
     category:"Tách được"},
    {id:"u137-07",phrase:"get up",meaningVi:"ra khỏi giường, thức dậy",
     explanation:"to get out of bed",
     pattern:"get up",objectType:"nội động từ (intransitive)",
     example:"I usually get up at six o'clock.",
     translation:"Tôi thường thức dậy lúc sáu giờ.",
     notes:[],category:"Nghĩa"},
    {id:"u137-08",phrase:"look after",meaningVi:"chăm sóc, trông nom",
     explanation:"to take care of somebody or something",
     pattern:"look after + noun",objectType:"không tách được (inseparable)",
     example:"She looks after her little brother every afternoon.",
     translation:"Cô ấy chăm sóc em trai mình mỗi buổi chiều.",
     notes:["✅ look after it  ❌ look it after"],
     category:"Không tách được"},
    {id:"u137-09",phrase:"look for",meaningVi:"tìm kiếm",
     explanation:"to try to find somebody or something",
     pattern:"look for + noun",objectType:"không tách được (inseparable)",
     example:"I'm looking for my keys. Have you seen them?",
     translation:"Tôi đang tìm chìa khoá. Bạn có thấy chúng không?",
     notes:["✅ look for it  ❌ look it for"],
     category:"Không tách được"},

const ALL_QUESTIONS = QUESTIONS.concat(AI_QUESTIONS);

/* =========================================================================
   4. STATE & STORAGE
   ========================================================================= */

function defaultState(){
  return {
    version: APP_VERSION,
    itemStats: {},      // id -> {seen, attempts, correct, wrong, last}
    mistakes: [],       // array of mistake records
    history: [],        // array of session records
    settings: { timer: 30, shuffleOptions: true, speech: false },
    studyPos: {},       // unitId -> last item index
    lastUnit: 137,
    sessions: 0,
    streak: { count: 0, last: null }
  };
}

let state = defaultState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ state = defaultState(); return; }
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== "object" || Array.isArray(parsed)){ state = defaultState(); return; }
    const base = defaultState();
    state = {
      version: APP_VERSION,
      itemStats: (parsed.itemStats && typeof parsed.itemStats === "object") ? parsed.itemStats : {},
      mistakes: Array.isArray(parsed.mistakes) ? parsed.mistakes.filter(m => m && typeof m === "object") : [],
      history: Array.isArray(parsed.history) ? parsed.history.filter(h => h && typeof h === "object") : [],
      settings: Object.assign(base.settings, (parsed.settings && typeof parsed.settings === "object") ? parsed.settings : {}),
      studyPos: (parsed.studyPos && typeof parsed.studyPos === "object") ? parsed.studyPos : {},
      lastUnit: typeof parsed.lastUnit === "number" ? parsed.lastUnit : 137,
      sessions: typeof parsed.sessions === "number" ? parsed.sessions : 0,
      streak: (parsed.streak && typeof parsed.streak === "object") ? parsed.streak : base.streak
    };
  }catch(err){
    console.warn("Storage corrupted, resetting.", err);
    state = defaultState();
  }
}

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(err){ console.warn("Could not save state", err); }
}

/* =========================================================================
   5. SMALL UTILITIES
   ========================================================================= */

const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function norm(s){
  return String(s == null ? "" : s)
    .toLowerCase()
    .replace(/[’‘`]/g, "'")
    .replace(/[.,!?;:"'()\[\]{}\-–—]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}
function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove("show"), 2200);
}
function getUnit(id){ return UNITS.find(u => u.id === Number(id)); }
function getAllStudyItems(){ return UNITS.flatMap(u => u.items); }
function findStudyItem(id){ return getAllStudyItems().find(i => i.id === id); }
function findQuestion(id){ return ALL_QUESTIONS.find(q => q.id === id); }

/* =========================================================================
   6. PROGRESS HELPERS
   ========================================================================= */

function statsFor(id){
  return state.itemStats[id] || { seen:0, attempts:0, correct:0, wrong:0, last:null };
}
function touchItem(id, correct){
  const s = state.itemStats[id] || (state.itemStats[id] = { seen:0, attempts:0, correct:0, wrong:0, last:null });
  s.seen = (s.seen || 0) + 1;
  if(typeof correct === "boolean"){
    s.attempts = (s.attempts || 0) + 1;
    if(correct) s.correct = (s.correct || 0) + 1;
    else s.wrong = (s.wrong || 0) + 1;
  }
  s.last = Date.now();
  saveState();
}
function markStudied(id){
  const s = state.itemStats[id] || (state.itemStats[id] = { seen:0, attempts:0, correct:0, wrong:0, last:null });
  s.seen = (s.seen || 0) + 1;
  s.last = Date.now();
  saveState();
}
function unitProgress(unitId){
  const u = getUnit(unitId);
  if(!u) return { percent:0, seen:0, total:0, accuracy:0, correct:0, wrong:0, attempts:0 };
  const total = u.items.length;
  let seen = 0;
  u.items.forEach(i => { if(statsFor(i.id).seen > 0) seen++; });

  let correct = 0, wrong = 0;
  const ids = u.items.map(i => i.id).concat(ALL_QUESTIONS.filter(q => q.unit === unitId).map(q => q.id));
  ids.forEach(id => {
    const s = statsFor(id);
    correct += s.correct || 0;
    wrong += s.wrong || 0;
  });
  const attempts = correct + wrong;
  return {
    percent: total ? Math.round(seen / total * 100) : 0,
    seen, total,
    accuracy: attempts ? Math.round(correct / attempts * 100) : 0,
    correct, wrong, attempts
  };
}
function overallStats(){
  let correct = 0, wrong = 0, attemptedIds = 0;
  Object.keys(state.itemStats).forEach(id => {
    const s = state.itemStats[id];
    const c = s.correct || 0, w = s.wrong || 0;
    correct += c; wrong += w;
    if(c + w > 0) attemptedIds++;
  });
  const attempts = correct + wrong;
  const totalStudyItems = getAllStudyItems().length;
  let seenItems = 0;
  getAllStudyItems().forEach(i => { if(statsFor(i.id).seen > 0) seenItems++; });
  return {
    correct, wrong, attempts,
    accuracy: attempts ? Math.round(correct / attempts * 100) : 0,
    attemptedIds,
    seenItems,
    totalStudyItems,
    unitsCompleted: UNITS.filter(u => unitProgress(u.id).percent === 100).length,
    sessions: state.sessions || 0,
    streak: (state.streak && state.streak.count) || 0,
    mastery: totalStudyItems ? Math.round(seenItems / totalStudyItems * 100) : 0
  };
}
function masteryStatus(accuracy, attempts){
  if(!attempts) return { label:"Chưa bắt đầu", cls:"", key:"none" };
  if(accuracy >= 85 && attempts >= 5) return { label:"Đã thành thạo", cls:"green", key:"mastered" };
  if(accuracy >= 70) return { label:"Đang tiến bộ", cls:"blue", key:"improving" };
  if(accuracy >= 50) return { label:"Đang luyện tập", cls:"amber", key:"practising" };
  return { label:"Đang học", cls:"red", key:"learning" };
}

/* =========================================================================
   7. MISTAKE RECORDING
   ========================================================================= */

function recordMistake(q, userAnswer, correctText){
  const existing = state.mistakes.find(m => m.qid === q.id);
  const now = Date.now();
  if(existing){
    existing.userAnswer = userAnswer;
    existing.correctAnswer = correctText;
    existing.timestamp = now;
    existing.errors = (existing.errors || 1) + 1;
    existing.attempts = (existing.attempts || 0) + 1;
    existing.reviewed = false;
  } else {
    state.mistakes.unshift({
      qid: q.id,
      unit: q.unit,
      type: q.type,
      part: q.part,
      userAnswer: userAnswer,
      correctAnswer: correctText,
      timestamp: now,
      attempts: 1,
      errors: 1,
      reviewed: false
    });
  }
  if(state.mistakes.length > 400) state.mistakes.length = 400;
  saveState();
}
function markMistakeReviewed(qid){
  const m = state.mistakes.find(x => x.qid === qid);
  if(m){ m.reviewed = true; saveState(); }
}
function removeMistake(qid){
  state.mistakes = state.mistakes.filter(m => m.qid !== qid);
  saveState();
}

/* =========================================================================
   8. STREAK & SESSION
   ========================================================================= */

function registerSession(){
  const today = todayKey();
  const st = state.streak || (state.streak = { count:0, last:null });
  if(st.last === today) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yKey = y.getFullYear() + "-" + String(y.getMonth()+1).padStart(2,"0") + "-" + String(y.getDate()).padStart(2,"0");
  st.count = (st.last === yKey) ? (st.count || 0) + 1 : 1;
  st.last = today;
  state.sessions = (state.sessions || 0) + 1;
  saveState();
}

function pushHistory(entry){
  state.history.unshift(entry);
  if(state.history.length > 120) state.history.length = 120;
  saveState();
}

const MOBILE_NAV = ["dashboard","units","practice","mistakes","progress"];

let currentView = "dashboard";
let viewParams = {};

function go(view, params){
  currentView = view;
  viewParams = params || {};
  if(view !== "quiz") stopTimer();
  render();
  window.scrollTo({ top:0, behavior:"instant" in window ? "instant" : "auto" });
  const main = $("#view");
  if(main) main.focus({ preventScroll:true });
}

function renderNav(){
  const sn = $("#sidebarNav");
  sn.innerHTML = '<div class="navsec">Menu</div>' + NAV.map(n =>
    `<button class="navitem ${currentView===n.id?'active':''}" data-nav="${n.id}">
       <span class="ic">${n.ic}</span><span>${esc(n.label)}</span>
     </button>`).join("");

  const mn = $("#mobileNav");
  mn.innerHTML = MOBILE_NAV.map(id => {
    const n = NAV.find(x => x.id === id);
    return `<button class="mnav ${currentView===n.id?'active':''}" data-nav="${n.id}">
      <span class="ic">${n.ic}</span><span>${esc(n.label.split(" ")[0])}</span>
    </button>`;
  }).join("");
}

/* =========================================================================
   10. MAIN RENDER
   ========================================================================= */

function render(){
  renderNav();
  const v = $("#view");
  let html = "";
  switch(currentView){
    case "dashboard": html = viewDashboard(); break;
    case "units":     html = viewUnits(); break;
    case "study":     html = viewStudy(); break;
    case "practice":  html = viewPractice(); break;
    case "quiz":      html = viewQuiz(); break;
    case "mistakes":  html = viewMistakes(); break;
    case "progress":  html = viewProgress(); break;
    case "search":    html = viewSearchView(); break;
    case "settings":  html = viewSettings(); break;
    default:          html = viewDashboard();
  }
  v.innerHTML = html;
  bindViewEvents();
  if(currentView === "quiz") afterQuizRender();
}

function viewDashboard(){
  const o = overallStats();
  const lastUnitId = state.lastUnit || 137;
  const lastUnit = getUnit(lastUnitId) || UNITS[0];
  const pos = state.studyPos[lastUnitId] || 0;

  const unitCards = UNITS.map(u => {
    const p = unitProgress(u.id);
    const m = masteryStatus(p.accuracy, p.attempts);
    return `
      <div class="unitcard">
        <div class="uhead">
          <div>
            <div class="unum">UNIT ${u.id}</div>
            <div class="utitle">${esc(u.title)}</div>
          </div>
          <span class="pill ${m.cls}">${esc(m.label)}</span>
        </div>
        <div class="udesc">${esc(u.subtitle)} — ${esc(u.desc)}</div>
        <div class="bar ${p.percent===100?'green':''}"><span style="width:${p.percent}%"></span></div>

function buildGrammarNotes(item){
  const notes = [];
  const phrase = item.phrase;

  const separable = /tách được/i.test(item.objectType || "");
  const inseparable = /không tách được/i.test(item.objectType || "");

  if(separable){
    notes.push(`
      <div class="note good"><strong>✅ Đúng:</strong> <span class="mono">Turn it on. / Turn the light on.</span></div>
      <div class="note bad"><strong>❌ Sai:</strong> <span class="mono">Turn on it.</span> — với đại từ, tiểu từ phải đứng SAU đại từ.</div>
    `);
  }
  if(inseparable){
    notes.push(`
      <div class="note bad"><strong>❌ Không được tách:</strong> <span class="mono">look it after</span> — giới từ phải đứng ngay sau động từ.</div>
    `);
  }
  if(/V-ing/i.test(item.pattern || "") || /V-ing/i.test(item.category || "")){
    notes.push(`
      <div class="note good"><strong>✅ Đúng:</strong> <span class="mono">${esc(item.example)}</span></div>
      <div class="note bad"><strong>❌ Sai:</strong> Dùng to-infinitive sau cụm này là sai. Hãy dùng <strong>V-ing</strong>.</div>
    `);
  }
  if(/\+ giới từ|cụm động từ \+ giới từ|Verb \+ preposition/i.test(item.objectType || "")){
    notes.push(`
      <div class="note"><strong>Giới từ là bắt buộc:</strong> giới từ tạo nên nghĩa của cả cụm. Bỏ giới từ sẽ sai nghĩa hoặc sai ngữ pháp.</div>
    `);
  }
  if(item.notes && item.notes.length){
    item.notes.forEach(n => notes.push(`<div class="note">${esc(n)}</div>`));
  }
  if(!notes.length){
    notes.push(`<p class="muted small">Không có ghi chú ngữ pháp riêng cho mục này. Hãy chú ý nghĩa của cả cụm trong ngữ cảnh.</p>`);
  }
  return notes.join("");
}

let quiz = null;
let timerId = null;

function stopTimer(){
  if(timerId){ clearInterval(timerId); timerId = null; }
}

function buildInstances(questions, shuffleOptions){
  return questions.map(q => {
    const inst = Object.assign({}, q);
    if(q.type === "mcq" && Array.isArray(q.options)){
      const opts = shuffleOptions ? shuffle(q.options) : q.options.slice();
      inst.shuffledOptions = opts;
    }
    if(q.type === "matching" && Array.isArray(q.pairs)){
      inst.rightOrder = shuffle(q.pairs.map(p => p.right));
      inst.leftOrder = shuffle(q.pairs.map(p => p.left));
    }
    return inst;
  });
}

function startQuiz(cfg){
  const questions = shuffle(cfg.questions.slice()).map(q => q);
  quiz = {
    title: cfg.title || "Practice",
    mode: cfg.mode || "practice",
    instances: buildInstances(questions, state.settings.shuffleOptions !== false),
    idx: 0,
    answers: {},
    checked: {},
    results: [],
    startedAt: Date.now(),
    elapsed: 0,
    timed: !!cfg.timed,
    remaining: (cfg.minutes || state.settings.timer || 30) * 60,
    finished: false,
    matchSel: null,
    matchAssign: {}
  };
  registerSession();
  go("quiz");
}

function startRandom(){
  const u = prompt("Chọn Unit để luyện tập (137–144, hoặc gõ 'all' cho tất cả):", "all");
  if(u === null) return;
  const val = u.trim().toLowerCase();
  let pool = ALL_QUESTIONS.slice();
  if(val !== "all" && val !== ""){
    const n = parseInt(val, 10);
    if(!isNaN(n)) pool = ALL_QUESTIONS.filter(q => q.unit === n);
  }
  if(!pool.length){ toast("Không tìm thấy câu hỏi phù hợp."); return; }
  const num = prompt("Số câu hỏi (10 / 20 / 30, hoặc số khác):", "10");
  if(num === null) return;
  let n = parseInt(num, 10);
  if(isNaN(n) || n < 1) n = 10;
  n = Math.min(n, pool.length);
  startQuiz({ title:"Random Practice (" + n + " câu)", questions: shuffle(pool).slice(0, n), mode:"random" });
}
function startWeakAreas(){
  const weak = [];
  // Questions with poor accuracy or never attempted but studied
  ALL_QUESTIONS.forEach(q => {
    const s = statsFor(q.id);
    const attempts = (s.correct||0) + (s.wrong||0);
    if(attempts === 0) return;
    const acc = Math.round((s.correct||0) / attempts * 100);
    if(acc < 80 || (s.wrong||0) >= 2) weak.push({ q, score: (s.wrong||0) * 3 + (100 - acc) / 10 });
  });
  // Mistakes always first priority
  state.mistakes.forEach(m => {
    const q = findQuestion(m.qid);
    if(q && !weak.find(w => w.q.id === q.id)) weak.push({ q, score: 100 + (m.errors||1) });
    else if(q){ const w = weak.find(w => w.q.id === q.id); if(w) w.score += 100 + (m.errors||1); }
  });

  if(!weak.length){
    toast("Chưa có đủ dữ liệu. Hãy làm vài bài trước nhé!");
    return;
  }
  weak.sort((a,b) => b.score - a.score);
  const picked = weak.slice(0, 20).map(w => w.q);
  startQuiz({ title:"Practice Weak Areas", questions: picked, mode:"weak" });
}
function startAllUnits(){
  startQuiz({
    title:"Full Test — Units 137–144",
    questions: QUESTIONS.slice(),
    mode:"full",
    timed:true,
    minutes: state.settings.timer || 30
  });
}

    body = `
      <p class="small muted">${label}</p>
      ${q.type === "transformation" ? `<p><strong>Cụm bắt buộc:</strong> <span class="pill blue">${esc(q.requiredPhrase)}</span></p>` : ""}
      <input class="inputline" id="textAnswer" type="text" value="${esc(val)}" placeholder="Nhập câu trả lời…" ${checked?"disabled":""} autocomplete="off" spellcheck="false">
    `;
  } else if(q.type === "matching"){
    const assigned = quiz.matchAssign[quiz.idx] || {};
    const sel = quiz.matchSel;
    const left = q.leftOrder || q.pairs.map(p => p.left);
    const right = q.rightOrder || q.pairs.map(p => p.right);
    const usedRight = Object.values(assigned);
    body = `
      <p class="small muted">Nhấn vào một cụm động từ bên trái, sau đó nhấn vào nghĩa tương ứng bên phải.</p>
      <div class="matchwrap">
        <div class="matchcol">
          ${left.map(l => {
            const a = assigned[l];
            let cls = "mitem";
            if(sel === l) cls += " sel";
            if(checked){
              const correct = q.pairs.find(p => p.left === l && p.right === a);
              cls = "mitem " + (correct ? "done" : "bad");
            } else if(a) cls += " matched";
            return `<button class="${cls}" data-mleft="${esc(l)}" ${checked?"disabled":""}>
              <strong>${esc(l)}</strong>
              ${a ? `<span class="tagline">→ ${esc(a)}</span>` : ""}
              ${checked && !q.pairs.find(p=>p.left===l && p.right===a) ? `<span class="tagline">Đúng: ${esc((q.pairs.find(p=>p.left===l)||{}).right)}</span>` : ""}
            </button>`;
          }).join("")}
        </div>
        <div class="matchcol">
          ${right.map(r => {
            let cls = "mitem";
            if(usedRight.indexOf(r) !== -1 && !checked) cls += " matched";
            if(checked){
              const isCorrectPair = Object.keys(assigned).some(l => assigned[l] === r && (q.pairs.find(p=>p.left===l)||{}).right === r);
              cls = "mitem " + (isCorrectPair ? "done" : "");
            }
            return `<button class="${cls}" data-mright="${esc(r)}" ${checked?"disabled":""}>${esc(r)}</button>`;
          }).join("")}
        </div>
      </div>
    `;
  }

  const progressPct = Math.round((quiz.idx) / total * 100);

  return `
    <div class="row between" style="margin-bottom:10px">
      <div>
        <div class="tiny muted" style="font-weight:700;letter-spacing:.05em">${esc(quiz.title)}</div>
        <h1 style="margin:0">Câu ${quiz.idx+1} / ${total}</h1>
      </div>
      <div class="row">
        ${quiz.timed ? `<span class="timerbox" id="timerBox">${fmtTime(quiz.remaining)}</span>` : ""}
        <button class="btn small" data-quit-quiz="1">Thoát</button>
      </div>
    </div>
    <div class="bar"><span style="width:${progressPct}%"></span></div>

    <div class="card" style="margin-top:14px">
      <div class="qhead">
        <span class="pill blue">Unit ${q.unit}</span>
        <span class="pill">${q.type === "mcq" ? "Multiple Choice" : q.type === "fill" ? "Fill in the Blank" : q.type === "matching" ? "Matching" : q.type === "correction" ? "Error Correction" : "Transformation"}</span>
        ${q.source === "ai-generated-practice" ? '<span class="pill amber">AI Generated</span>' : '<span class="pill green">Source Practice</span>'}
      </div>
      <div class="qtext">${esc(q.question)}</div>
      ${q.hint ? `<p class="small muted">💡 Gợi ý: <strong>${esc(q.hint)}</strong></p>` : ""}
      ${body}

      ${checked ? renderFeedback(q, feedback) : ""}

      <hr>
      <div class="row between">
        <button class="btn" data-quiz-prev="1" ${quiz.idx===0?"disabled":""}>← Câu trước</button>
        <div class="row">
          ${!checked
            ? `<button class="btn primary" id="btnCheck" data-quiz-check="1">Kiểm tra</button>`
            : `<button class="btn primary" data-quiz-next="1">${quiz.idx === total-1 ? "Xem kết quả" : "Câu tiếp theo →"}</button>`}
        </div>
      </div>
    </div>
  `;
}

function renderFeedback(q, res){
  if(!res) return "";
  if(res.correct){
    return `<div class="feedback ok">
      <h4>✅ Correct — Chính xác!</h4>
      <div>${esc(res.explanation || q.explanation || "")}</div>
    </div>`;
  }
  let detail = "";
  if(q.type === "matching" && res.detail){
    detail = "<ul style='margin:8px 0 0;padding-left:18px'>" + res.detail.map(d =>
      `<li>${esc(d.left)} → <span class="${d.ok?'righttxt':'wrongtxt'}">${esc(d.got)}</span> ${d.ok?"":" <span class='muted'>(đúng: "+esc(d.expected)+")</span>"}</li>`
    ).join("") + "</ul>";
  }
  return `<div class="feedback no">
    <h4>❌ Incorrect</h4>
    <div><strong>Câu trả lời đúng:</strong> <span class="righttxt">${esc(res.correctText)}</span></div>
    ${detail}
    <div style="margin-top:8px">${esc(res.explanation || q.explanation || "")}</div>
  </div>`;
}

function afterQuizRender(){
  // focus text input for typing questions
  if(!quiz || quiz.finished) return;
  const q = quiz.instances[quiz.idx];
  if(!quiz.checked[quiz.idx] && (q.type === "fill" || q.type === "correction" || q.type === "transformation")){
    const inp = $("#textAnswer");
    if(inp) inp.focus();
  }
  startTimerIfNeeded();
}

function startTimerIfNeeded(){
  if(!quiz || !quiz.timed || quiz.finished) return;
  if(timerId) return;
  timerId = setInterval(() => {
    if(!quiz || quiz.finished){ stopTimer(); return; }
    quiz.remaining--;
    quiz.elapsed++;
    const box = $("#timerBox");
    if(box){
      box.textContent = fmtTime(quiz.remaining);
      box.classList.toggle("warn", quiz.remaining <= 300 && quiz.remaining > 60);
      box.classList.toggle("danger", quiz.remaining <= 60);
    }
    if(quiz.remaining === 300) toast("⏰ Còn 5 phút!");
    if(quiz.remaining === 60) toast("⏰ Còn 1 phút!");
    if(quiz.remaining <= 0){
      stopTimer();
      toast("⏰ Hết giờ — bài được nộp tự động.");
      finishQuiz();
    }
  }, 1000);
}

/* ---------- answering ---------- */

function selectOption(value){
  if(!quiz || quiz.finished) return;
  if(quiz.checked[quiz.idx]) return;
  quiz.answers[quiz.idx] = value;
  render();
}

function selectMatchLeft(left){
  if(!quiz || quiz.finished || quiz.checked[quiz.idx]) return;
  quiz.matchSel = (quiz.matchSel === left) ? null : left;
  render();
}

function selectMatchRight(right){
  if(!quiz || quiz.finished || quiz.checked[quiz.idx]) return;
  if(!quiz.matchSel){ toast("Hãy chọn một cụm động từ bên trái trước."); return; }
  const q = quiz.instances[quiz.idx];
  const assigned = quiz.matchAssign[quiz.idx] || (quiz.matchAssign[quiz.idx] = {});
  // remove any existing assignment to this right value
  Object.keys(assigned).forEach(k => { if(assigned[k] === right) delete assigned[k]; });
  assigned[quiz.matchSel] = right;
  quiz.matchSel = null;
  render();
}

function checkCurrent(){
  if(!quiz || quiz.finished) return;
  const i = quiz.idx;
  if(quiz.checked[i]) return;
  const q = quiz.instances[i];
  let userAnswer = quiz.answers[i];

  if(q.type === "matching"){
    userAnswer = quiz.matchAssign[i] || {};
    const missing = q.pairs.some(p => !userAnswer[p.left]);
    if(missing){ toast("Hãy nối hết tất cả các cặp trước khi kiểm tra."); return; }
  } else {
    if(typeof userAnswer !== "string" || !userAnswer.trim()){
      if(q.type === "mcq"){ toast("Hãy chọn một đáp án."); return; }
      toast("Hãy nhập câu trả lời của bạn."); return;
    }
    if(q.type === "mcq"){
      const ok = userAnswer === q.answer;
      const res = { correct: ok, correctText: q.answer, explanation: q.explanation };
      quiz.results[i] = res;
      quiz.checked[i] = true;
      touchItem(q.id, ok);
      if(!ok) recordMistake(q, userAnswer, q.answer);
      else markMistakeReviewed(q.id);
      render();
      return;
    }
  }

  // text / matching
  const res = evaluateAnswer(q, userAnswer);
  quiz.results[i] = res;
  quiz.checked[i] = true;
  touchItem(q.id, res.correct);
  if(!res.correct) recordMistake(q, formatUserAnswer(q, userAnswer), res.correctText);
  else markMistakeReviewed(q.id);
  render();
}

function formatUserAnswer(q, a){
  if(q.type === "matching"){
    return Object.keys(a).map(k => k + " = " + a[k]).join("; ");
  }
  return String(a);
}

function evaluateAnswer(q, userAnswer){
  if(q.type === "matching"){
    let allCorrect = true;
    const detail = [];
    q.pairs.forEach(p => {
      const got = userAnswer[p.left];
      const ok = got === p.right;
      if(!ok) allCorrect = false;
      detail.push({ left:p.left, expected:p.right, got: got || "—", ok });
    });
    return {
      correct: allCorrect,
      correctText: q.pairs.map(p => p.left + " = " + p.right).join(" · "),
      explanation: q.explanation,
      detail
    };
  }
  const list = q.answers || [];
  const ok = list.some(a => norm(a) === norm(userAnswer));
  return {
    correct: ok,
    correctText: list[0] || "",
    explanation: q.explanation
  };
}

function nextQuestion(){
  if(!quiz) return;
  if(quiz.idx >= quiz.instances.length - 1){ finishQuiz(); return; }
  quiz.idx++;
  quiz.matchSel = null;
  render();
}
function prevQuestion(){
  if(!quiz || quiz.idx === 0) return;
  quiz.idx--;
  quiz.matchSel = null;
  render();
}

/* ---------- finishing ---------- */

function finishQuiz(){
  if(!quiz || quiz.finished) return;
  stopTimer();
  quiz.finished = true;
  const total = quiz.instances.length;
  let correct = 0, incorrect = 0, unanswered = 0;
  quiz.instances.forEach((q, i) => {
    const r = quiz.results[i];
    if(!r){ unanswered++; return; }
    if(r.correct) correct++; else incorrect++;
  });
  quiz.score = { total, correct, incorrect, unanswered };
  quiz.durationSec = Math.round((Date.now() - quiz.startedAt) / 1000);

  // group by part/unit for the summary
  const byPart = {};
  quiz.instances.forEach((q, i) => {
    const key = q.source === "ai-generated-practice" ? "AI Generated" : ("Part " + q.part);
    if(!byPart[key]) byPart[key] = { total:0, correct:0 };
    byPart[key].total++;
    if(quiz.results[i] && quiz.results[i].correct) byPart[key].correct++;
  });

  pushHistory({
    date: Date.now(),
    title: quiz.title,
    mode: quiz.mode,
    total, correct, incorrect, unanswered,
    duration: quiz.durationSec
  });

  render();
}

function searchContent(query){
  const raw = query.trim().toLowerCase();
  const nq = norm(query);
  let unitFilter = null;
  const m = raw.match(/unit\s*(\d{3})/);
  if(m) unitFilter = Number(m[1]);

  const out = [];
  getAllStudyItems().forEach(item => {
    const unit = UNITS.find(u => u.items.indexOf(item) !== -1);
    if(unitFilter && unit.id !== unitFilter) return;
    const hay = [
      item.phrase, item.meaningVi, item.explanation, item.pattern,
      item.example, item.translation, item.category, item.objectType,
      (item.notes || []).join(" ")
    ].join(" ").toLowerCase();
    if(hay.indexOf(raw) !== -1 || norm(hay).indexOf(nq) !== -1){
      out.push({
        id:item.id, unit:unit.id, phrase:item.phrase, meaningVi:item.meaningVi,
        explanation:item.explanation, example:item.example, translation:item.translation
      });
    }
  });
  return out.slice(0, 60);
}

/* =========================================================================
   19. SETTINGS
   ========================================================================= */

function viewSettings(){
  const s = state.settings;
  return `
    <h1>Settings</h1>

    <div class="card">
      <h2>Practice options</h2>
      <div class="row" style="margin-bottom:10px">
        <label style="display:flex;align-items:center;gap:8px">
          <input type="checkbox" id="optShuffle" ${s.shuffleOptions !== false ? "checked" : ""}>
          <span>Đảo thứ tự đáp án trong câu hỏi trắc nghiệm</span>
        </label>
      </div>
      <div class="row">
        <label style="display:flex;align-items:center;gap:8px">
          <span>Thời gian làm Full Test (phút):</span>
          <input class="inputline" id="optTimer" type="number" min="5" max="180" value="${Number(s.timer) || 30}" style="max-width:110px">
        </label>
      </div>
    </div>

    <div class="card">
      <h2>Progress data</h2>
      <div class="row">
        <button class="btn" id="btnExport">⬇️ Export Progress (JSON)</button>
        <button class="btn" id="btnImport">⬆️ Import Progress</button>
        <input type="file" id="importFile" accept="application/json,.json" style="display:none">
      </div>
      <p class="tiny muted" style="margin-top:8px">Dữ liệu tiến độ được lưu trong trình duyệt của bạn (localStorage). Xuất file để sao lưu hoặc chuyển sang thiết bị khác.</p>
    </div>

    <div class="card">
      <h2>Reset</h2>
      <p class="muted small">Xoá toàn bộ tiến độ, số lần làm bài, lỗi sai và thống kê. Nội dung bài học không bị ảnh hưởng.</p>
      <button class="btn danger" id="btnReset">🗑️ Reset Progress</button>
    </div>

    <div class="card">
      <h2>About</h2>
      <p class="small muted">Phrasal Verbs Mastery — English Grammar B1–B2, Units 137–144.<br>
      Phiên bản ứng dụng: ${APP_VERSION}. Dữ liệu lưu cục bộ, không cần đăng nhập, không gửi dữ liệu lên máy chủ.</p>
      <p class="small muted">Nút 🔊 sử dụng giọng đọc do trình duyệt tạo (browser-generated speech), không phải bản thu giọng người bản xứ.</p>
    </div>
  `;
}

function exportProgress(){
  try{
    const blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "phrasal-verbs-progress-" + todayKey() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("Đã xuất file tiến độ.");
  }catch(e){ toast("Không thể xuất file."); }
}

function importProgress(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(String(reader.result));
      if(!data || typeof data !== "object" || Array.isArray(data)) throw new Error("bad");
      if(!data.itemStats && !data.mistakes && !data.history) throw new Error("bad");
      const base = defaultState();
      state = {
        version: APP_VERSION,
        itemStats: (data.itemStats && typeof data.itemStats === "object") ? data.itemStats : {},
        mistakes: Array.isArray(data.mistakes) ? data.mistakes : [],
        history: Array.isArray(data.history) ? data.history : [],
        settings: Object.assign(base.settings, (data.settings && typeof data.settings === "object") ? data.settings : {}),
        studyPos: (data.studyPos && typeof data.studyPos === "object") ? data.studyPos : {},
        lastUnit: typeof data.lastUnit === "number" ? data.lastUnit : 137,
        sessions: typeof data.sessions === "number" ? data.sessions : 0,
        streak: (data.streak && typeof data.streak === "object") ? data.streak : base.streak
      };
      saveState();
      toast("Đã nhập tiến độ thành công.");
      go("dashboard");
    }catch(e){
      toast("File không hợp lệ — tiến độ hiện tại được giữ nguyên.");
    }
  };
  reader.onerror = () => toast("Không đọc được file.");
  reader.readAsText(file);
}

function resetProgress(){
  if(!confirm("Are you sure you want to reset all learning progress?")) return;
  state = defaultState();
  saveState();
  toast("Đã xoá toàn bộ tiến độ học tập.");
  go("dashboard");
}

/* =========================================================================
   20. SPEECH (optional, browser-generated)
   ========================================================================= */

function speak(text){
  try{
    if(!("speechSynthesis" in window)){ toast("Trình duyệt không hỗ trợ đọc văn bản."); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB";
    u.rate = 0.92;
    window.speechSynthesis.speak(u);
    toast("🔊 Browser-generated speech");
  }catch(e){ /* ignore */ }
}

/* =========================================================================
   21. EVENT BINDING
   ========================================================================= */

function bindViewEvents(){
  const v = $("#view");
  v.onclick = null; // reset
  v.addEventListener("click", handleViewClick);
}

function handleViewClick(ev){
  const t = ev.target.closest("[data-nav],[data-start-study],[data-start-unit-practice],[data-continue],[data-weak],[data-random],[data-all-units],[data-start-part],[data-start-ai],[data-tab],[data-study-prev],[data-study-next],[data-study-goto],[data-study-random],[data-opt],[data-quiz-check],[data-quiz-next],[data-quiz-prev],[data-quit-quiz],[data-mleft],[data-mright],[data-retry-mistake],[data-clear-mistake],[data-clear-reviewed],[data-result-review],[data-result-retry],[data-result-mistakes],[data-speak],[data-search-study]");
  if(!t) return;

  const d = t.dataset;

  if(d.nav){ go(d.nav); return; }
  if(d.speak){ speak(d.speak); return; }

  if(d.startStudy){
    const uid = Number(d.startStudy);
    const pos = state.studyPos[uid] || 0;
    go("study", { unit: uid, index: pos });
    return;
  }
  if(d.startUnitPractice){ startUnitPractice(d.startUnitPractice); return; }
  if(d.startPart){ startPart(Number(d.startPart)); return; }
  if(d.startAi){ startAiPractice(); return; }
  if(d.continue){
    const last = state.lastUnit || 137;
    go("study", { unit: last, index: state.studyPos[last] || 0 });
    return;
  }
  if(d.weak){ startWeakAreas(); return; }
  if(d.random){ startRandom(); return; }
  if(d.allUnits){ startAllUnits(); return; }

  if(d.tab){
    studyTab = d.tab;
    $$(".tab[data-tab]").forEach(b => b.classList.toggle("active", b.dataset.tab === studyTab));
    $$(".panel").forEach(p => p.classList.toggle("active", p.dataset.panel === studyTab));
    return;
  }
  if(d.studyPrev){
    go("study", { unit: Number(viewParams.unit || state.lastUnit), index: Math.max(0, (Number(viewParams.index)||0) - 1) });
    return;
  }
  if(d.studyNext){
    const uid = Number(viewParams.unit || state.lastUnit);
    const u = getUnit(uid);
    const cur = Number(viewParams.index) || 0;
    if(cur >= u.items.length - 1){ go("units"); toast("Bạn đã học hết Unit " + uid + "! 🎉"); return; }
    go("study", { unit: uid, index: cur + 1 });
    return;
  }
  if(d.studyGoto){
    go("study", { unit: Number(viewParams.unit || state.lastUnit), index: Number(d.studyGoto) });
    return;
  }
  if(d.studyRandom){
    const uid = Number(viewParams.unit || state.lastUnit);
    const u = getUnit(uid);
    go("study", { unit: uid, index: Math.floor(Math.random() * u.items.length) });
    return;
  }

  if(d.opt !== undefined && t.classList.contains("opt")){ selectOption(d.opt); return; }
  if(d.quizCheck){ checkCurrent(); return; }
  if(d.quizNext){ nextQuestion(); return; }
  if(d.quizPrev){ prevQuestion(); return; }
  if(d.quitQuiz){
    if(confirm("Bạn có chắc muốn thoát bài luyện tập? Tiến độ bài hiện tại sẽ không được lưu.")){
      stopTimer(); quiz = null; go("practice");
    }
    return;
  }
  if(d.mleft !== undefined){ selectMatchLeft(d.mleft); return; }
  if(d.mright !== undefined){ selectMatchRight(d.mright); return; }

  if(d.retryMistake){
    const q = findQuestion(d.retryMistake);
    if(q) startQuiz({ title:"Retry — " + q.id, questions:[q], mode:"retry" });
    else toast("Không tìm thấy câu hỏi.");
    return;
  }
  if(d.clearMistake){ removeMistake(d.clearMistake); render(); toast("Đã xoá khỏi danh sách lỗi sai."); return; }
  if(d.clearReviewed){
    state.mistakes = state.mistakes.filter(m => !m.reviewed);
    saveState(); render(); toast("Đã xoá các lỗi đã xem lại.");
    return;
  }

  if(d.resultReview){
    const el = $("#answerReview");
    if(el) el.scrollIntoView({ behavior:"smooth", block:"start" });
    return;
  }
  if(d.resultRetry){
    if(quiz && quiz.mode === "full") startAllUnits();
    else if(quiz) startQuiz({ title: quiz.title, questions: quiz.instances.map(x => findQuestion(x.id) || x), mode: quiz.mode, timed: quiz.timed, minutes: state.settings.timer });
    return;
  }
  if(d.resultMistakes){ startWeakAreas(); return; }

  if(d.searchStudy){
    go("study", { unit: Number(d.searchStudy), index: 0 });
    return;
  }
}

/* global document-level delegation for nav buttons outside #view */
document.addEventListener("click", ev => {
  const navBtn = ev.target.closest("[data-nav]");
  if(navBtn && !ev.target.closest("#view")){ go(navBtn.dataset.nav); }
});

/* header settings button */
document.addEventListener("click", ev => {
  if(ev.target.closest("#btnSettingsTop")) go("settings");
});

/* top search */
$("#globalSearch").addEventListener("keydown", ev => {
  if(ev.key === "Enter"){
    lastSearch = ev.target.value;
    go("search");
  }
});
$("#globalSearch").addEventListener("input", ev => {
  if(currentView === "search"){
    lastSearch = ev.target.value;
    const v = $("#view");
    v.innerHTML = viewSearchView(lastSearch);
    const inp = $("#searchInput");
    if(inp){ inp.value = lastSearch; }
  }
});

/* settings controls (delegated) */
document.addEventListener("change", ev => {
  if(ev.target.id === "optShuffle"){
    state.settings.shuffleOptions = ev.target.checked; saveState(); toast("Đã lưu cài đặt.");
  }
  if(ev.target.id === "optTimer"){
    let n = parseInt(ev.target.value, 10);
    if(isNaN(n) || n < 5) n = 5; if(n > 180) n = 180;
    state.settings.timer = n; saveState(); toast("Thời gian Full Test: " + n + " phút.");
  }
  if(ev.target.id === "importFile"){
    const f = ev.target.files && ev.target.files[0];
    if(f) importProgress(f);
    ev.target.value = "";
  }
});
document.addEventListener("click", ev => {
  if(ev.target.id === "btnExport") exportProgress();
  if(ev.target.id === "btnImport") $("#importFile").click();
  if(ev.target.id === "btnReset") resetProgress();
});

/* keyboard: Enter to check / next in quiz */
document.addEventListener("keydown", ev => {
  if(currentView !== "quiz" || !quiz || quiz.finished) return;
  if(ev.key === "Enter"){
    const q = quiz.instances[quiz.idx];
    const isText = q.type === "fill" || q.type === "correction" || q.type === "transformation";
    if(isText && document.activeElement && document.activeElement.id === "textAnswer"){
      ev.preventDefault();
      if(!quiz.checked[quiz.idx]) checkCurrent(); else nextQuestion();
    }
  }
});

/* keep text answer in state while typing */
document.addEventListener("input", ev => {
  if(ev.target && ev.target.id === "textAnswer" && quiz){
    quiz.answers[quiz.idx] = ev.target.value;
  }
});

/* unit filter select */
document.addEventListener("change", ev => {
  if(ev.target && ev.target.id === "unitFilter"){
    unitsFilter = ev.target.value;
    render();
  }
});

/* search view input */
document.addEventListener("input", ev => {
  if(ev.target && ev.target.id === "searchInput"){
    lastSearch = ev.target.value;
    const v = $("#view");
    const cur = v.innerHTML;
    v.innerHTML = viewSearchView(lastSearch);
    const inp = $("#searchInput");
    if(inp){ inp.focus(); inp.setSelectionRange(lastSearch.length, lastSearch.length); }
  }
});

/* =========================================================================
   22. INIT
   ========================================================================= */

function initApp(){
  loadState();
  // register a session once per day
  registerSession();
  // if the stored lastUnit is invalid, fall back
  if(!getUnit(state.lastUnit)) state.lastUnit = 137;
  render();
}

initApp();
</script>
